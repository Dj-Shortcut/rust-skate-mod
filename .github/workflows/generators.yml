name: Content generators

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generators-${{ github.ref }}
  cancel-in-progress: true

# Regenerates the authored content from the committed generator scripts and
# compares the result byte for byte with the committed files. A match shows the
# committed files are exactly what the committed script produces with no
# inputs beyond its own code; it says nothing about who wrote the script.
jobs:
  # Report-only because it depends on download.blender.org. The .blend files
  # embed save metadata and are not compared.
  models:
    name: Regenerate the models (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RAMP_BLENDER: blender-5.2.0-linux-x64
      RAMP_SHA256: 96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48
    steps:
      - uses: actions/checkout@v4
      # Restore and save separately so the download is cached even when the
      # comparison below fails.
      - uses: actions/cache/restore@v4
        id: ramp-blender
        with:
          path: ${{ runner.temp }}/${{ env.RAMP_BLENDER }}
          key: ${{ env.RAMP_BLENDER }}-${{ env.RAMP_SHA256 }}
      - name: Download the ramp authoring Blender version
        if: steps.ramp-blender.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://download.blender.org/release/Blender5.2/$RAMP_BLENDER.tar.xz" -o "$RUNNER_TEMP/$RAMP_BLENDER.tar.xz"
          printf '%s  %s\n' "$RAMP_SHA256" "$RUNNER_TEMP/$RAMP_BLENDER.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$RAMP_BLENDER.tar.xz" -C "$RUNNER_TEMP"
      - uses: actions/cache/save@v4
        if: steps.ramp-blender.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/${{ env.RAMP_BLENDER }}
          key: ${{ env.RAMP_BLENDER }}-${{ env.RAMP_SHA256 }}
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0
      - name: Generate
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          cp assets/authored/manifest.json "$RUNNER_TEMP/models/manifest.json"
          "$RUNNER_TEMP/$RAMP_BLENDER/blender" -b --factory-startup \
            --python scripts/generate_skate_ramp_assets.py -- --output "$RUNNER_TEMP/models"
          "$RUNNER_TEMP/$RAMP_BLENDER/blender" -b --factory-startup \
            --python scripts/generate_skate_board.py -- --output "$RUNNER_TEMP/models" --no-previews
      - name: Compare with the committed files
        run: |
          set -o pipefail
          echo "### Model regeneration" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/compare_glb.py assets/authored "$RUNNER_TEMP/models" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regenerated-models-${{ github.sha }}
          path: ${{ runner.temp }}/models
          retention-days: 14
